[package]
name = "freshdesk"
version = "0.1.0"
edition = "2024"
authors = ["Delnegend <kiennguyen19323@gmail.com>"]
description = "Freshdesk API client and CLI written in Rust"
license = "MIT"

[dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "fs", "process"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "cookies"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6.7", features = ["derive", "env"] }
url = "2.5.8"
base64 = "0.23.1"
dotenvy = "0.15.7"
thiserror = "2.0.21"
chrono = { version = "0.4.45", features = ["serde"] }
comfy-table = "8.0.1"
rust_xlsxwriter = "0.99.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[bin]]
name = "freshdesk"
path = "src/main.rs"

[lib]
name = "freshdesk"
path = "src/lib.rs"
