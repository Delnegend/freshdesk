[package]
name = "freshdesk"
version = "0.2.4"
edition = "2024"
authors = ["Delnegend <kiennguyen19323@gmail.com>"]
description = "Freshdesk API client and CLI written in Rust"
license = "MIT"

[dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "fs", "process"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "cookies"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6.7", features = ["derive", "env"] }
url = "2.5.8"
base64 = "0.23.1"
dotenvy = "0.15.7"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing", "serde-well-known"] }
comfy-table = "8.0.1"
rust_xlsxwriter = "0.100.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[bin]]
name = "freshdesk"
path = "src/main.rs"

[lib]
name = "freshdesk"
path = "src/lib.rs"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
